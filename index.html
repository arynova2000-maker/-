<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Инга — 60 лет</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;color:#4a2c24}
body{
  min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 15%,rgba(255,210,140,.55),transparent 25%),
    radial-gradient(circle at 85% 25%,rgba(177,91,45,.28),transparent 28%),
    linear-gradient(135deg,#f5d39d 0%,#c76d3e 45%,#713c2d 100%);
}
body:before,body:after{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.75;
  background-image:
    radial-gradient(ellipse 9px 4px at 8% 18%,#9b452c 0 65%,transparent 70%),
    radial-gradient(ellipse 8px 4px at 22% 72%,#e2a23b 0 65%,transparent 70%),
    radial-gradient(ellipse 10px 5px at 78% 16%,#8b3d29 0 65%,transparent 70%),
    radial-gradient(ellipse 9px 4px at 92% 67%,#d98732 0 65%,transparent 70%),
    radial-gradient(ellipse 7px 4px at 66% 84%,#a64c28 0 65%,transparent 70%);
  background-size:220px 180px,270px 240px,240px 210px,300px 260px,250px 220px;
  animation:fall 18s linear infinite;
}
body:after{opacity:.35;transform:scale(1.5);animation-duration:26s;animation-delay:-8s}
@keyframes fall{from{transform:translateY(-5vh) rotate(0)}to{transform:translateY(8vh) rotate(10deg)}}
.card{
  width:min(92%,700px); margin:5vh auto; padding:42px 28px 34px;
  text-align:center; position:relative; overflow:hidden;
  background:rgba(255,248,233,.91); border:1px solid rgba(116,65,42,.2);
  border-radius:28px; box-shadow:0 25px 70px rgba(62,30,19,.32);
  backdrop-filter:blur(5px);
}
.branch{font-size:42px;letter-spacing:12px;margin-bottom:4px}
.kicker{font-size:15px;letter-spacing:4px;text-transform:uppercase;color:#99603e}
h1{font-size:clamp(42px,10vw,76px);margin:10px 0 0;color:#7d3527;font-weight:500}
.age{font-size:clamp(68px,17vw,120px);line-height:.9;margin:5px 0 18px;color:#b15a32;font-weight:bold}
.subtitle{font-size:23px;margin:0 auto 25px;line-height:1.45}
.divider{width:90px;height:2px;background:#c38a5b;margin:22px auto}
.invite{font-size:18px;line-height:1.6;margin:0 auto 26px;max-width:560px}
form{max-width:460px;margin:0 auto}
input{
  width:100%;padding:15px 17px;border:1px solid #c99c77;border-radius:14px;
  font-size:16px;outline:none;background:#fffaf2;color:#4a2c24;
}
input:focus{box-shadow:0 0 0 3px rgba(177,90,50,.15)}
button{
  width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;
  background:#873d2d;color:white;font-size:17px;font-weight:bold;cursor:pointer;
  box-shadow:0 8px 20px rgba(100,45,32,.22);
}
button:hover{background:#6f3025}
#answer{display:none;margin-top:18px;padding:15px;border-radius:14px;background:#f5e1c6;color:#713c2d;font-size:17px}
.music{
  position:fixed;right:16px;bottom:16px;z-index:10;width:auto;margin:0;
  border-radius:50%;padding:13px 16px;background:rgba(75,40,30,.88);
}
.small{font-size:13px;color:#8a6654;margin-top:18px}
</style>
</head>
<body>
<main class="card">
  <div class="branch">🍂 🍁 🍂</div>
  <div class="kicker">Приглашение на юбилей</div>
  <h1>Инга</h1>
  <div class="age">60</div>
  <p class="subtitle">лет — прекрасный повод<br>собраться с близкими и друзьями!</p>
  <div class="divider"></div>
  <p class="invite">
    Дорогие родные, друзья и близкие!<br>
    Приглашаю вас разделить со мной этот особенный день,
    наполненный теплом, улыбками и приятными воспоминаниями.
  </p>

  <form id="rsvp">
    <input id="name" type="text" placeholder="Ваше ФИО" autocomplete="name" required>
    <button type="submit">Да, буду на юбилее 🎉</button>
  </form>
  <div id="answer"></div>
  <div class="small">Буду рада видеть вас на моём юбилее! ❤️</div>
</main>

<button class="music" id="musicBtn" aria-label="Включить музыку">🎵 Включить музыку</button>

<script>
let audioCtx = null;
let master = null;
let playing = false;
let timer = null;
let noteIndex = 0;

const melody = [
  [261.63, 0.55], [329.63, 0.55], [392.00, 0.75],
  [523.25, 0.90], [392.00, 0.55], [329.63, 0.55],
  [293.66, 0.75], [349.23, 0.90],
  [261.63, 0.55], [329.63, 0.55], [440.00, 0.75],
  [523.25, 0.90], [440.00, 0.55], [392.00, 0.55],
  [329.63, 0.90], [261.63, 1.10]
];

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    master = audioCtx.createGain();
    master.gain.value = 0.16;
    master.connect(audioCtx.destination);
  }
  return audioCtx.resume();
}

function playNote(freq, duration) {
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, now);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.20, now + 0.035);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

  osc.connect(gain);
  gain.connect(master);
  osc.start(now);
  osc.stop(now + duration + 0.04);
}

function startMusic() {
  ensureAudio().then(() => {
    if (playing) return;
    playing = true;
    document.getElementById("musicBtn").textContent = "🔊 Музыка включена";

    function next() {
      if (!playing) return;
      const [freq, duration] = melody[noteIndex % melody.length];
      playNote(freq, duration);
      noteIndex++;
      timer = setTimeout(next, duration * 1000);
    }
    next();
  });
}

function stopMusic() {
  playing = false;
  clearTimeout(timer);
  document.getElementById("musicBtn").textContent = "🎵 Включить музыку";
}

document.getElementById("musicBtn").addEventListener("click", function(e) {
  e.stopPropagation();
  if (playing) stopMusic();
  else startMusic();
});

document.getElementById("rsvp").addEventListener("submit", function(e) {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  if (!name) return;

  const safeName = name.replace(/[<>]/g, "");
  const answer = document.getElementById("answer");
  answer.style.display = "block";
  answer.innerHTML =
    "Спасибо, <b>" + safeName + "</b>! 🍂<br>" +
    "Ваш ответ «Да, буду» принят. Будем ждать вас на юбилее! ❤️";

  document.getElementById("name").value = "";

  // После подтверждения также предлагаем музыку, но запускаем только
  // в рамках действия пользователя, чтобы браузер не блокировал звук.
  startMusic();
});
</script>
</body>
</html>
